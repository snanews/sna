<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">

  <!-- 搶先在畫面渲染前讀取 localStorage 並套用主題，徹底消除白光閃爍 -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem("theme");
      const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = savedTheme || (systemDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>松山新聞社 SNA</title>
  <!-- 引入全站共用樣式表 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 頁首容器：由 js/index.js 動態渲染 -->
  <header id="site-header-container" class="site-header"></header>

  <!-- 網站主要內容區塊 -->
  <main class="container">

    <!-- 本週焦點新聞容器 (自動渲染最新一篇) -->
    <section class="section-block" id="featured-container">
      <!-- 動態載入焦點新聞 -->
    </section>

    <!-- 推薦內容區塊 (依點閱率排序) -->
    <section class="section-block">
      <h2 class="section-title">推薦內容</h2>
      <div class="home-news-grid" id="recommended-container">
        <!-- 動態載入熱門文章 -->
      </div>
    </section>

    <!-- 學權專區區塊 (自動篩選學權分類) -->
    <section class="section-block">
      <h2 class="section-title">學權專區</h2>
      <div class="home-news-grid" id="rights-container">
        <!-- 動態載入學權文章 -->
      </div>
    </section>

    <!-- 社內公告區塊 -->
    <section class="section-block">
      <h2 class="section-title">社內公告</h2>
      <div class="announcement-list" id="announcement-container">
        <!-- 動態載入公告清單 -->
      </div>
    </section>

  </main>

  <!-- 頁尾容器 -->
  <footer id="site-footer-container" class="site-footer">
    <div class="footer-container">
      <p>松山新聞社 SNA © 2026</p>
    </div>
  </footer>

  <!-- 載入共用導覽列模組 -->
  <script src="js/header.js"></script>

  <!-- 載入首頁專屬控制邏輯 -->
  <script src="js/index.js"></script>
</body>
</html>
