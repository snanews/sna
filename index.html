<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>松山新聞社 SNA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 頁首容器 -->
  <header id="site-header-container" class="site-header"></header>

  <!-- 主要內容區塊 -->
  <main class="container">

    <!-- 本週焦點新聞容器 -->
    <section class="section-block" id="featured-container">
      <!-- JS 會自動把最新文章渲染到這裡 -->
    </section>

    <!-- 第一區：推薦內容容器 (熱門點閱) -->
    <section class="section-block">
      <h2 class="section-title">推薦內容</h2>
      <div class="news-grid" id="recommended-container">
        <!-- JS 會自動將高點閱文章渲染到這裡 -->
      </div>
    </section>

    <!-- 第二區：學權內容容器 -->
    <section class="section-block">
      <h2 class="section-title">學權專區</h2>
      <div class="news-grid" id="rights-container">
        <!-- JS 會自動篩選學權分類渲染到這裡 -->
      </div>
    </section>

    <!-- 第三區：公告容器 -->
    <section class="section-block">
      <h2 class="section-title">社內公告</h2>
      <div class="announcement-list" id="announcement-container">
        <!-- JS 會自動將公告清單渲染到這裡 -->
      </div>
    </section>

  </main>

  <!-- 頁尾容器 -->
  <footer id="site-footer-container" class="site-footer"></footer>

  <!-- 載入首頁專屬 JS -->
  <script src="js/index.js"></script>
</body>
</html>
