<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章內頁 - 松山新聞社 SNA</title>
  <!-- 因為在根目錄，直接抓 css/ -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/article.css">
</head>
<body>

  <!-- 頁首容器 -->
  <header id="site-header-container" class="site-header"></header>

  <!-- 文章內頁主要容器 -->
  <main class="container article-container" id="article-main-container">
    
    <!-- 文章標題與詮釋資料 -->
    <header class="article-header">
      <span class="article-category-tag" id="article-category">載入中...</span>
      <h1 class="article-title" id="article-title">載入文章標題中...</h1>
      <div class="article-meta" id="article-meta">
        <span>載入時間中...</span>
      </div>
    </header>

    <!-- 積木渲染容器 -->
    <main class="article-content-blocks" id="article-blocks">
      <p style="color: var(--text-muted); text-align: center; padding: 20px;">正在讀取報導內容與積木排版...</p>
    </main>

    <!-- 文章底部資訊／標籤 -->
    <footer class="article-footer-info">
      <div class="article-tags">
        <span>#松山新聞社</span>
        <span>#SNA</span>
        <span>#學權自治</span>
      </div>
    </footer>

  </main>

  <!-- 頁尾容器 -->
  <footer id="site-footer-container" class="site-footer"></footer>

  <!-- 載入根目錄下的 article.js -->
  <script src="js/article.js"></script>
</body>
</html>
